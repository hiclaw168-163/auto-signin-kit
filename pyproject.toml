[project]
name = "auto-signin-kit"
version = "0.1.0"
description = "AI 编程助手每日签到自动化工具箱 / Auto check-in & rewards toolkit for AI coding assistants (WorkBuddy, Qoder CN, Trae CN)"
readme = "README.md"
requires-python = ">=3.11"
# 协议正文见仓库根 LICENSE;改动协议要同步这里、LICENSE 和 README 的「许可」节。
license = { text = "MIT" }
dependencies = [
  "typer>=0.12",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "rich>=13.0",
  # trae 域 SS_AES 信封解密依赖(win_dpapi.decrypt_cbc 优先走它,
  # 缺了会退回 Windows CNG 并在非 Windows 平台崩溃)
  "cryptography>=42.0",
  # doubao 域 CDP 兜底: 客户端带调试端口运行时取实时 Cookie(仅该路径 import)
  "websocket-client>=1.6",
  # 项目自己的业务依赖(渲染库/客户端 SDK 等)加在这里
]

# Web 管理台可选依赖(SPEC-09): CLI/定时任务的安装不引 web 栈,
# 装界面才需要: uv tool install 'auto-signin-kit[web]'
[project.optional-dependencies]
web = [
  "fastapi>=0.110",
  "uvicorn>=0.30",
]

[project.scripts]
auto-signin-kit = "auto_signin_kit.cli:main"
# 如果想要额外的短命令别名,加一行就行,只要键名不重复即可:
# dk = "auto_signin_kit.cli:main"

# 域注册表: 新增一个域只需要在这里加一行,cli.py 不需要改动。
# 加完记得 `uv sync && uv tool install --editable . --force`——
# entry_points 写在 dist-info 里,只改这个文件不会自动生效。
[project.entry-points."auto_signin_kit.domains"]
workbuddy = "auto_signin_kit.domains.workbuddy:app"
qoder = "auto_signin_kit.domains.qoder:app"
trae = "auto_signin_kit.domains.trae:app"
schedule = "auto_signin_kit.domains.schedule:app"
doubao = "auto_signin_kit.domains.doubao:app"

# Web 管理台(非业务域,独立 entry-point 组,SPEC-09);cli.py 同样只遍历挂载。
[project.entry-points."auto_signin_kit.ui"]
ui = "auto_signin_kit.ui.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_signin_kit"]

# 如果项目有需要随包分发的静态资源(字体/数据文件),取消下面的注释并按需改路径:
# [tool.hatch.build.targets.wheel.force-include]
# "assets" = "auto_signin_kit/assets"
# 脚手架默认把 config/ 放在仓库根(editable 布局,见 core/config 的 resolve_config_dir)。
# wheel 安装也需要自带配置时,把仓库根 config/ 打进包内:
# "config" = "auto_signin_kit/config"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.16", "import-linter>=2.0",
       # ui 层测试(SPEC-09): TestClient 依赖 httpx;fastapi 只进 dev 与 web extra,
       # 基础安装(schtasks 无头运行)始终精瘦。
       "fastapi>=0.110", "httpx>=0.27"]

# --- 架构门禁: import-linter -------------------------------------------
# import-linter 管得了的用它;管不了的(单文件行数、cli.py 是否混入业务逻辑
# 这类"检查代码文本模式"的规则)用 tests/test_architecture_gate.py 补,
# 两者互补,不是二选一。
[tool.importlinter]
root_package = "auto_signin_kit"

[[tool.importlinter.contracts]]
name = "总体分层"
type = "layers"
layers = [
    "auto_signin_kit.ui",
    "auto_signin_kit.cli",
    "auto_signin_kit.domains",
    "auto_signin_kit.orchestration",
    "auto_signin_kit.core",
]

# ui 层只准走 service/子进程,不准 import 各域的 cli 模块(SPEC-09 §2)。
[[tool.importlinter.contracts]]
name = "ui 不碰各域 cli"
type = "forbidden"
source_modules = ["auto_signin_kit.ui"]
forbidden_modules = ["auto_signin_kit.domains.*.cli"]

[[tool.importlinter.contracts]]
name = "core 不依赖 domains"
type = "forbidden"
source_modules = ["auto_signin_kit.core"]
forbidden_modules = ["auto_signin_kit.domains"]

# core/ports/ 已建(定时调度有三种真实实现: schtasks / launchd / cron),
# 所以这条契约启用: 端口只准放形状,不准反过来依赖具体实现。
[[tool.importlinter.contracts]]
name = "ports 不依赖 adapters"
type = "forbidden"
source_modules = ["auto_signin_kit.core.ports"]
forbidden_modules = ["auto_signin_kit.core.adapters"]

[[tool.importlinter.contracts]]
name = "domains 之间彼此独立"
type = "independence"
modules = [
    "auto_signin_kit.domains.workbuddy",
    "auto_signin_kit.domains.qoder",
    "auto_signin_kit.domains.trae",
    "auto_signin_kit.domains.schedule",
    "auto_signin_kit.domains.doubao",
]
ignore_imports = [
    # schedule 域注册调度前要探测各域客户端是否就绪(未就绪的任务不注册——
    # 启用了也跑不起来的调度没有意义);探测实现在各自域,schedule 只调 is_installed,
    # 只读探测,显式登记。
    "auto_signin_kit.domains.schedule.service -> auto_signin_kit.domains.workbuddy.runtime",
    "auto_signin_kit.domains.schedule.service -> auto_signin_kit.domains.qoder.auth",
    "auto_signin_kit.domains.schedule.service -> auto_signin_kit.domains.trae.auth",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: 需要真外部系统(网络/数据库/真仓库)的用例,默认不跑",
]

[tool.ruff]
line-length = 100
target-version = "py311"

# 规约用工具固化: 规则集就是 docs/standards/STD-04 的"强制"部分。
# 新增强制条款先改这里,让违反即失败,不要只写进文档。
# docstring 只启用 D1(必须有 docstring);中文句号结尾是推荐项(D4 不进门禁)。
[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D1", "UP", "B", "C4", "SIM", "T20"]
# UP031: `%` 格式是本项目的既定风格,不强制迁 f-string
# SIM112: Windows 环境变量解名(ProgramFiles(x86) 等)就是 OS 的规范名,大小写不容改写
ignore = ["UP031", "SIM112"]

[tool.ruff.lint.per-file-ignores]
# 测试的用例名即文档,不强制逐用例 docstring;模块级 docstring 仍要求
"tests/**" = ["D1"]
# JS 是注入客户端运行时的解密助手原文(逐行对齐原项目),禁改排版
"src/auto_signin_kit/domains/workbuddy/helper_js.py" = ["E501"]
